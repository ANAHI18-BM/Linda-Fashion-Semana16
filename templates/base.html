<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda Fashion Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'components/navbar.html' %}
    <div class="container mt-3">{% for categoria,mensaje in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ categoria }}" role="alert">{{ mensaje }}</div>{% endfor %}</div>
    {% block content %}{% endblock %}
    {% include 'components/footer.html' %}
    <a class="carrito-flotante d-print-none" href="{{ url_for('carrito') }}" aria-label="Abrir carrito, {{ carrito_cantidad }} prendas">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 3h3l3 13h11l3-9H6"/><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></svg>
      <span>{{ carrito_cantidad }}</span>
    </a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
