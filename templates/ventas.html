{% extends 'base.html' %}{% block content %}<main class="container py-5"><h1>Ventas registradas</h1><div class="table-responsive"><table class="table"><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Comprobante</th></tr></thead><tbody>{% for v in filas %}<tr><td>{{ v.id }}</td><td>{{ v.cliente }}</td><td>{{ v.fecha }}</td><td>${{ '%.2f'|format(v.total) }}</td><td><a href="{{ url_for('comprobante',id=v.id) }}">Ver detalle</a></td></tr>{% else %}<tr><td colspan="5">Todavía no hay ventas del carrito.</td></tr>{% endfor %}</tbody></table></div></main>{% endblock %}
