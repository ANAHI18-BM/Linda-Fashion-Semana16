services:
  - type: web
    name: linda-fashion-boutique
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask --app app init-db && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: linda-fashion-db
          property: connectionString
databases:
  - name: linda-fashion-db
    plan: free
    databaseName: linda_fashion
